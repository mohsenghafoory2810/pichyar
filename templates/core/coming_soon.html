{% extends "base.html" %}

{% block title %}{{ title }} | {{ site_settings.site_name }}{% endblock %}

{% block content %}
<section class="card mx-auto max-w-xl px-6 py-12 text-center">
  <h1 class="text-2xl font-extrabold">{{ title }}</h1>
  {% if query %}<p class="mt-3 text-ink-soft">عبارت جستجو: «{{ query }}»</p>{% endif %}
  <p class="mt-3 text-ink-soft">این بخش به‌زودی راه‌اندازی می‌شود.</p>
  <a href="{% url 'core:home' %}" class="btn-secondary mt-6">بازگشت به صفحهٔ اصلی</a>
</section>
{% endblock %}
