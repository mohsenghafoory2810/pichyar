{# Header cart icon; re-sent out-of-band (oob=True) after HTMX cart changes. #}
{% with count=cart_count|default:0 %}
<a href="{% url 'cart:detail' %}" id="header-cart" class="relative rounded-lg p-2 hover:bg-cream/10"
   aria-label="سبد خرید، {{ count|fa_digits }} کالا"{% if oob %} hx-swap-oob="true"{% endif %}>
  <svg aria-hidden="true" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
  <span id="cart-count" class="absolute -top-0.5 -left-0.5 min-w-5 rounded-full bg-gold px-1 text-center text-xs font-bold leading-5 text-ink">{{ count|fa_digits }}</span>
</a>
{% endwith %}
