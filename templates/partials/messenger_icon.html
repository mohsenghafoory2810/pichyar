{# Inline icon for a contact channel: {% include "partials/messenger_icon.html" with key="bale|whatsapp|telegram|phone|chat" %} #}
<span aria-hidden="true" class="messenger-icon messenger-icon--{{ key }}">
{% if key == "whatsapp" %}<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.2a8.8 8.8 0 0 0-7.6 13.3L3.2 20.8l4.4-1.2A8.8 8.8 0 1 0 12 3.2Z"/><path d="M9 8.2c-.4 2.9 3.6 7 6.8 6.6l.7-1.4-2-1-.9.9c-1.1-.4-2.4-1.7-2.8-2.8l.9-.9-1-2Z" fill="currentColor" stroke-width="1"/></svg>
{% elif key == "telegram" %}<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 4 2.8 11.2l5.7 2 2 6.1 3.3-3.8 5 3.7Z"/><path d="m8.5 13.2 9-6.2-7 7.8"/></svg>
{% elif key == "bale" %}<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5c5 0 8.5 3.3 8.5 7.6S17 18.7 12 18.7c-.9 0-1.8-.1-2.6-.3L4.5 20.5l1.3-3.9A7.3 7.3 0 0 1 3.5 11.1C3.5 6.8 7 3.5 12 3.5Z"/><path d="m8.5 11.2 2.4 2.4 4.6-4.6" stroke-linecap="round"/></svg>
{% elif key == "chat" %}<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4Z"/><path d="M8 9.5h8M8 12.5h5" stroke-linecap="round"/></svg>
{% else %}<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>
{% endif %}</span>
