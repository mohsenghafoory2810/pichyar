{% extends "base.html" %}

{% block content %}
<div class="grid gap-6 md:grid-cols-4">
  <nav class="card h-fit p-2" aria-label="حساب کاربری">
    <p class="px-3 py-2 font-bold">{% if user.name %}{{ user.name }}{% else %}<bdi dir="ltr">{{ user.mobile|fa_digits }}</bdi>{% endif %}</p>
    <ul class="flex gap-1 overflow-x-auto md:flex-col">
      <li><a href="{% url 'accounts:orders' %}" class="block whitespace-nowrap rounded-xl px-3 py-2 {% if tab == 'orders' %}bg-ink text-cream{% else %}hover:bg-ink/5{% endif %}"{% if tab == 'orders' %} aria-current="page"{% endif %}>سفارش‌ها</a></li>
      <li><a href="{% url 'accounts:addresses' %}" class="block whitespace-nowrap rounded-xl px-3 py-2 {% if tab == 'addresses' %}bg-ink text-cream{% else %}hover:bg-ink/5{% endif %}"{% if tab == 'addresses' %} aria-current="page"{% endif %}>نشانی‌ها</a></li>
      <li><a href="{% url 'accounts:profile' %}" class="block whitespace-nowrap rounded-xl px-3 py-2 {% if tab == 'profile' %}bg-ink text-cream{% else %}hover:bg-ink/5{% endif %}"{% if tab == 'profile' %} aria-current="page"{% endif %}>مشخصات</a></li>
      <li>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="block w-full whitespace-nowrap rounded-xl px-3 py-2 text-start text-error hover:bg-error/10">خروج</button>
        </form>
      </li>
    </ul>
  </nav>
  <section class="md:col-span-3">
    {% block panel %}{% endblock %}
  </section>
</div>
{% endblock %}
