name: pichyar

x-app: &app
  build: .
  image: pichyar:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - db:/app/data/db
    - media:/app/data/media
    - private:/app/data/private
    - backups:/app/data/backups
    - logs:/app/data/logs

services:
  app:
    <<: *app
    command: ["sh", "docker/app-start.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    <<: *app
    command: ["sh", "docker/worker-start.sh"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # The worker touches this file every 5 minutes (core.tasks.heartbeat).
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 900 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db:
  media:
  private:
  backups:
  logs:
  caddy_data:
  caddy_config:
